spring.application.name=moviebooking

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate


jwt.secret=${JWT_SECRET:Q7vN9mLp2Xk8Za4RwE1HyUc6JfT3sPd8BnVm5CgYxK9qWs2ErH7LtDz1FuAiMoNp}
jwt.expiration=${JWT_EXPIRATION:86400000}
spring.jpa.open-in-view=false
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Server
server.port=8080

# Frontend URLs allowed to call this API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Optional: create the first admin on startup
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Demo data (movies, cinemas, shows, demo users) loaded once into an empty database
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}
app.demo-data.password=${DEMO_PASSWORD:Demo@1234}
