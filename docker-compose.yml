# Runs the whole project locally with one command:
#   docker compose up --build
# Backend:  http://localhost:8080/swagger-ui/index.html
# Database: PostgreSQL on localhost:5433 (user/password: postgres/postgres)

services:

  db:
    image: postgres:16
    container_name: event-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: event-booking-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/eventdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eventbook.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}

volumes:
  pg-data:
